name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall alarm_api apps connectors mcp_servers rag

      - name: Start Alarm API simulator
        run: |
          nohup uvicorn alarm_api.main:app --host 127.0.0.1 --port 8000 > alarm-api.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:8000/health

      - name: Start MCP server
        env:
          ALARM_API_BASE_URL: http://127.0.0.1:8000
          ALARM_API_TOKEN: demo-token
        run: |
          nohup python -m mcp_servers.alarm_management.server > mcp-server.log 2>&1 &
          sleep 5
          curl --fail http://127.0.0.1:9000/sse -N --max-time 2 || true

      - name: Run tests
        env:
          ALARM_API_BASE_URL: http://127.0.0.1:8000
          ALARM_API_TOKEN: demo-token
          MCP_SERVER_URL: http://127.0.0.1:9000/sse
          DOCUMENT_PATH: ./rag/documents
        run: |
          python -m pytest -q

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            alarm-api.log
            mcp-server.log

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose build
