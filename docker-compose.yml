services:
  alarm-api:
    build: .
    command: uvicorn alarm_api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      ALARM_API_TOKEN: demo-token

  alarm-mcp:
    build: .
    command: python -m mcp_servers.alarm_management.server
    ports:
      - "9000:9000"
    environment:
      ALARM_API_BASE_URL: http://alarm-api:8000
      ALARM_API_TOKEN: demo-token
    depends_on:
      - alarm-api

  copilot-backend:
    build: .
    command: uvicorn apps.backend.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      MCP_SERVER_URL: http://alarm-mcp:9000/sse
      DOCUMENT_PATH: /app/rag/documents
    volumes:
      - ./rag/documents:/app/rag/documents
    depends_on:
      - alarm-mcp

  frontend:
    build: .
    command: streamlit run apps/frontend/app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      COPILOT_BACKEND_URL: http://copilot-backend:8080
    depends_on:
      - copilot-backend
